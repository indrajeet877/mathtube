<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathTube — maths &amp; AI videos Hacker News keeps recommending</title>
  <meta name="description" content="Maths and AI videos that Hacker News commenters have recommended, ranked by distinct recommenders.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c1917'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='14' fill='%23f6f1e7'%3EMT%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#list">Skip to videos</a>
  <header class="site-header">
    <p class="mark" aria-hidden="true">MT</p>
    <h1>MathTube: the maths &amp; AI videos Hacker News keeps recommending</h1>
    <p class="sub" id="subline">Loading the corpus…</p>
    <p class="inspired">Inspired by <a href="https://karpathy.bearblog.dev/hacker-tube/">@karpathy's HackerTube</a></p>
  </header>

  <div class="controls">
    <label class="search-label" for="q">Search</label>
    <input id="q" type="search" placeholder="Search titles, channels, topics" autocomplete="off" enterkeyhint="search">
    <div id="topics" class="topics" role="toolbar" aria-label="Filter by topic"></div>
  </div>

  <p id="count" class="result-count" aria-live="polite"></p>
  <div id="list"></div>

  <footer class="site-footer">
    <p id="method"></p>
    <p><a href="https://github.com/indrajeet877/mathtube">github.com/indrajeet877/mathtube</a></p>
  </footer>

  <noscript>MathTube needs JavaScript to load <code>data/videos.json</code>.</noscript>
  <script src="app.js"></script>
</body>
</html>
